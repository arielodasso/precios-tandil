name: nightly-scrape
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC = 00:00 ART
  workflow_dispatch: # ejecución manual desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # 4 horas máximo
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape all stores + refresh aggregates
        run: pnpm --filter @precios/worker run ingest-all

      - name: Update Vercel deployment
        if: success()
        run: npx vercel --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
