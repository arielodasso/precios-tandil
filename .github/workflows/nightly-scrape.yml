name: nightly-scrape
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC = 00:00 ART
  workflow_dispatch: # ejecución manual desde GitHub

# Un job por tienda en paralelo evita superar el timeout de 4h del job único
# (carrefour ~1h + vea >2h + cooperativa persistía/fallaba y los cancelaba).
# El job "finalize" corre los agregados, la purga y la detección de ofertas.
jobs:
  scrape:
    name: scrape-${{ matrix.store }}
    runs-on: ubuntu-latest
    timeout-minutes: 300 # 5 horas por tienda (GitHub público permite hasta 6h)
    strategy:
      fail-fast: false
      matrix:
        store: [golopolis, carrefour, monarca, dia, cooperativa-obrera, vea]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape ${{ matrix.store }}
        run: pnpm --filter @precios/worker run ingest --store ${{ matrix.store }}
        env:
          NODE_ENV: production

  finalize:
    name: finalize
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always()
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Post-process (purge, aggregates, series, deals)
        run: pnpm --filter @precios/worker run finalize
        env:
          NODE_ENV: production

      - name: Update Vercel deployment
        if: success()
        run: npx vercel --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
